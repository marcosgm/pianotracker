name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-and-test-frontend:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Run linter
        working-directory: frontend
        run: npm run lint
      
      - name: Run unit tests
        working-directory: frontend
        run: npm run test:coverage
      
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      
      - name: Check bundle size
        working-directory: frontend
        run: |
          SIZE=$(stat -f%z dist/main.js || wc -c < dist/main.js)
          SIZE_KB=$((SIZE / 1024))
          echo "Bundle size: ${SIZE_KB}KB"
          if [ $SIZE_KB -gt 200 ]; then
            echo "❌ Bundle size exceeds 200KB limit"
            exit 1
          fi
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
        continue-on-error: true

  lint-and-test-backend:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run type check
        working-directory: backend
        run: python -m mypy src --ignore-missing-imports || true
      
      - name: Run linter
        working-directory: backend
        run: python -m ruff check src
      
      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.xml
          flags: backend
        continue-on-error: true

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-test-frontend, lint-and-test-backend]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: pianotracker-backend:latest

  validate-openapi:
    name: Validate OpenAPI Spec
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install spectral
        run: npm install -g @stoplight/spectral-cli
      
      - name: Validate OpenAPI
        run: spectral lint specs/001-practice-tracker/contracts/openapi.yaml

  docs:
    name: Update Documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate API docs
        run: |
          echo "API documentation would be generated here"
          echo "OpenAPI spec location: specs/001-practice-tracker/contracts/openapi.yaml"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install safety
      
      - name: Scan Python dependencies
        working-directory: backend
        run: safety check --json
        continue-on-error: true

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [lint-and-test-frontend, lint-and-test-backend, build-docker, validate-openapi]
    if: always()
    
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.lint-and-test-frontend.result }}" = "failure" ] || \
             [ "${{ needs.lint-and-test-backend.result }}" = "failure" ] || \
             [ "${{ needs.build-docker.result }}" = "failure" ] || \
             [ "${{ needs.validate-openapi.result }}" = "failure" ]; then
            echo "❌ CI Pipeline failed"
            exit 1
          fi
          echo "✅ CI Pipeline passed"
